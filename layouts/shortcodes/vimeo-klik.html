{{/* Een voorvertoning met afspeelknop die naar Vimeo linkt. Er gaat pas iets
     naar Vimeo als iemand klikt. Het id staat tussen aanhalingstekens: de
     ingebouwde vimeo-shortcode van Hugo 0.128 schreef het als 1.12e+09. */}}
{{- $id := .Get "id" | string -}}
<a href="https://vimeo.com/{{ $id }}" target="_blank" rel="noopener" title="{{ .Get "title" }}"
   style="display:block; position:relative; border-radius:6px; overflow:hidden; background:#000;">
  <img src="{{ .Get "img" | relURL }}" alt="{{ .Get "title" }}" loading="lazy" style="display:block; width:100%; height:auto; margin:0;">
  <svg viewBox="0 0 61 61" aria-hidden="true" style="position:absolute; left:50%; top:50%; width:64px; height:64px; margin:-32px 0 0 -32px;"><circle cx="30.5" cy="30.5" r="30.5" opacity=".8" fill="#000"/><path d="M25.3 19.2c-2.1-1.2-3.8-.2-3.8 2.2v18.1c0 2.4 1.7 3.4 3.8 2.2l16.6-9.1c2.1-1.2 2.1-3.2 0-4.4l-16.6-9z" fill="#fff"/></svg>
</a>
